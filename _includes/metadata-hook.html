<!-- Web fonts for the amber-phosphor theme: Inter (body) + JetBrains Mono (terminal) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Default new visitors to the dark phosphor theme, using Chirpy's own `theme`
     localStorage key so the sidebar toggle (System/Light/Dark) stays in sync.
     Runs synchronously in <head> to set the attribute before first paint. -->
<script>
  (function () {
    try {
      if (!localStorage.getItem('theme')) {
        localStorage.setItem('theme', 'dark');
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
      /* Boot sequence plays once per browsing session; flag it before first paint. */
      if (!sessionStorage.getItem('booted')) {
        document.documentElement.classList.add('booting');
      }
    } catch (e) {}
  })();
</script>

<!-- Build-time stats for the terminal flourishes (statusline, hero). -->
<script>
  window.__LAB__ = {
    posts: {{ site.posts | size }},
    tags: {{ site.tags | size }},
    categories: {{ site.categories | size }},
    built: "{{ site.time | date: '%Y-%m-%d' }}",
    search: "{{ '/assets/js/data/search.json' | relative_url }}"
  };
</script>
<script defer src="{{ '/assets/js/amber-terminal.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/amber-cli.js' | relative_url }}"></script>
